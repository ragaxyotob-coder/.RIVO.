<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RIVO - TikTok Style</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* App Container */
        .app-container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Feed Section */
        .feed {
            flex: 1;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scrollbar-width: none;
        }
        .feed::-webkit-scrollbar { display: none; }

        .post {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .post-video-mock {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(45deg, #111, #222);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            color: #333;
        }

        /* Overlay Info */
        .post-overlay {
            position: absolute;
            bottom: 80px;
            right: 15px;
            left: 80px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .username-container {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .username {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .badge-founder {
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .verified-check {
            color: #20d5ec;
            font-size: 0.9rem;
        }

        .caption {
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        /* Actions Sidebar */
        .actions-sidebar {
            position: absolute;
            bottom: 100px;
            left: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .action-btn span {
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #000;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            color: #888;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .nav-item.active { color: #fff; }
        .nav-item span { font-size: 0.65rem; }

        .add-btn {
            background: linear-gradient(90deg, #00f2fe, #ff0050);
            padding: 3px;
            border-radius: 8px;
        }
        .add-btn-inner {
            background: #fff;
            color: #000;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Modals & Screens */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e1e1e;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        .btn-primary {
            background: #ff0050;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Profile Screen */
        .profile-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            margin-bottom: 15px;
            border: 2px solid #ff0050;
        }

        .verify-requests {
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
            background: #111;
            padding: 15px;
            border-radius: 8px;
        }

        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Feed -->
    <div class="feed">
        <div class="post">
            <div class="post-video-mock"><i class="fa-solid fa-play"></i></div>
            <div class="post-overlay">
                <div class="username-container">
                    <span class="username" id="feed-username">FARS</span>
                    <span class="badge-founder" id="feed-founder-badge">المؤسس</span>
                    <i class="fa-solid fa-circle-check verified-check" id="feed-verified"></i>
                </div>
                <div class="caption">مرحباً بكم في منصة RIVO! التطبيق المصمم بنمط تيك توك 🔥</div>
            </div>
            <div class="actions-sidebar">
                <button class="action-btn" onclick="toggleLike(this)"><i class="fa-solid fa-heart"></i><span>12.5K</span></button>
                <button class="action-btn"><i class="fa-solid fa-comment-dots"></i><span>842</span></button>
                <button class="action-btn"><i class="fa-solid fa-share"></i><span>إعادة نشر</span></button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="closeProfile()"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
        <button class="nav-item" onclick="openProfile()"><i class="fa-solid fa-user"></i><span>الملف الشخصي</span></button>
    </div>
</div>

<!-- Login Modal -->
<div class="modal" id="login-modal" style="display: flex;">
    <div class="modal-content">
        <h3 style="text-align: center;">تسجيل الدخول إلى RIVO</h3>
        <input type="text" id="login-input" class="input-field" placeholder="أدخل اسم المستخدم...">
        <button class="btn-primary" onclick="login()">دخول</button>
    </div>
</div>

<!-- Profile Screen -->
<div class="profile-screen" id="profile-screen">
    <div class="avatar"><i class="fa-solid fa-user"></i></div>
    <div class="username-container">
        <h2 id="profile-name">FARS</h2>
        <span class="badge-founder" id="profile-founder-badge" style="display:none;">المؤسس</span>
        <i class="fa-solid fa-circle-check verified-check" id="profile-verified" style="display:none;"></i>
    </div>
    <p style="color: #888; font-size: 0.85rem; margin-top: 5px;" id="user-role-text"></p>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-secondary" onclick="editName()">تغيير الاسم</button>
        <button class="btn-primary" id="req-verify-btn" onclick="requestVerification()">طلب توثيق الحساب</button>
    </div>

    <!-- Founder Admin Panel -->
    <div class="verify-requests" id="admin-panel" style="display: none;">
        <h4 style="margin-bottom: 10px; color: #00f2fe;">طلبات التوثيق المعلقة (للمؤسس فقط):</h4>
        <div id="requests-list">
            <p style="color: #666; font-size: 0.8rem;">لا توجد طلبات معلقة حالياً</p>
        </div>
    </div>

    <button class="btn-secondary" style="margin-top: auto; margin-bottom: 80px; width: 80%; background: #222;" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
    // System State
    let currentUser = localStorage.getItem('rivo_user') || null;
    let pendingRequests = JSON.parse(localStorage.getItem('rivo_requests')) || [];

    // Check system state on load
    window.onload = function() {
        if (!currentUser) {
            document.getElementById('login-modal').style.display = 'flex';
        } else {
            document.getElementById('login-modal').style.display = 'none';
            updateUI();
        }
    };

    function login() {
        const input = document.getElementById('login-input').value.trim();
        if (!input) return alert('الرجاء إدخال اسم المستخدم');

        currentUser = input;
        localStorage.setItem('rivo_user', currentUser);
        
        // Setup initial user data if new
        if (!localStorage.getItem(`user_${currentUser}`)) {
            const isFounder = (currentUser.toUpperCase() === 'FARS');
            const userData = {
                name: currentUser,
                isFounder: isFounder,
                isVerified: isFounder // Founder is auto-verified
            };
            localStorage.setItem(`user_${currentUser}`, JSON.stringify(userData));
        }

        document.getElementById('login-modal').style.display = 'none';
        updateUI();
    }

    function logout() {
        localStorage.removeItem('rivo_user');
        location.reload();
    }

    function getUserData() {
        return JSON.parse(localStorage.getItem(`user_${currentUser}`)) || { name: currentUser, isFounder: false, isVerified: false };
    }

    function updateUI() {
        const userData = getUserData();
        
        // Update Feed
        document.getElementById('feed-username').innerText = userData.name;
        document.getElementById('feed-founder-badge').style.display = userData.isFounder ? 'inline-block' : 'none';
        document.getElementById('feed-verified').style.display = userData.isVerified ? 'inline-block' : 'none';

        // Update Profile
        document.getElementById('profile-name').innerText = userData.name;
        document.getElementById('profile-founder-badge').style.display = userData.isFounder ? 'inline-block' : 'none';
        document.getElementById('profile-verified').style.display = userData.isVerified ? 'inline-block' : 'none';

        if (userData.isFounder) {
            document.getElementById('user-role-text').innerText = "حساب المؤسس الرئيسي";
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('req-verify-btn').style.display = 'none';
            renderRequests();
        } else {
            document.getElementById('user-role-text').innerText = userData.isVerified ? "حساب موثق" : "مستخدم عادٍ";
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('req-verify-btn').style.display = userData.isVerified ? 'none' : 'inline-block';
        }
    }

    function editName() {
        const newName = prompt("أدخل الاسم الجديد:", currentUser);
        if (newName && newName.trim() !== "") {
            const oldUser = currentUser;
            const userData = getUserData();
            userData.name = newName.trim();
            
            // If founder changes name, keep founder status
            currentUser = newName.trim();
            localStorage.setItem('rivo_user', currentUser);
            localStorage.setItem(`user_${currentUser}`, JSON.stringify(userData));
            
            updateUI();
        }
    }

    function requestVerification() {
        if (pendingRequests.includes(currentUser)) {
            alert("طلبك قيد المراجعة من قبل المؤسس FARS");
            return;
        }
        pendingRequests.push(currentUser);
        localStorage.setItem('rivo_requests', JSON.stringify(pendingRequests));
        alert("تم إرسال طلب التوثيق للمؤسس FARS للموافقة عليه.");
    }

    function renderRequests() {
        const listDiv = document.getElementById('requests-list');
        listDiv.innerHTML = '';

        if (pendingRequests.length === 0) {
            listDiv.innerHTML = '<p style="color: #666; font-size: 0.8rem;">لا توجد طلبات معلقة حالياً</p>';
            return;
        }

        pendingRequests.forEach(username => {
            const item = document.createElement('div');
            item.className = 'request-item';
            item.innerHTML = `
                <span>${username}</span>
                <div>
                    <button class="btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="approveVerify('${username}')">موافقة</button>
                </div>
            `;
            listDiv.appendChild(item);
        });
    }

    function approveVerify(username) {
        let uData = JSON.parse(localStorage.getItem(`user_${username}`)) || { name: username, isFounder: false, isVerified: false };
        uData.isVerified = true;
        localStorage.setItem(`user_${username}`, JSON.stringify(uData));

        // Remove from pending
        pendingRequests = pendingRequests.filter(u => u !== username);
        localStorage.setItem('rivo_requests', JSON.stringify(pendingRequests));

        alert(`تم توثيق حساب ${username} بنجاح!`);
        updateUI();
    }

    function openProfile() {
        document.getElementById('profile-screen').style.display = 'flex';
    }

    function closeProfile() {
        document.getElementById('profile-screen').style.display = 'none';
    }

    function toggleLike(btn) {
        const icon = btn.querySelector('i');
        if (icon.style.color === 'rgb(255, 0, 80)') {
            icon.style.color = '#fff';
        } else {
            icon.style.color = '#ff0050';
        }
    }
</script>
</body>
</html>
